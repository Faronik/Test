name: Windows native server
on:
  push:
    branches: [main]
    tags: ['native-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 69a1a33b4ba2b21e392c17e215ff637290778a97
          path: build/vcpkg
      - name: Prepare pinned vcpkg
        shell: pwsh
        run: ./build/vcpkg/bootstrap-vcpkg.bat -disableMetrics
      - name: Build standalone C++ server and installer
        shell: pwsh
        run: ./scripts/build-windows.ps1 -VcpkgRoot "$PWD/build/vcpkg" -Installer
      - name: Exercise native server, service and installer
        shell: pwsh
        run: |
          try { ./tests/windows-native.ps1 }
          catch {
            $message = ($_ | Out-String).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=Windows integration check failed::$message"
            throw
          }
      - name: Record SHA256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { $_.Hash.ToLower() + '  ' + (Split-Path $_.Path -Leaf) } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Toolstock-Windows-x64
          path: dist/*
          if-no-files-found: error
      - name: Publish native release
        if: startsWith(github.ref, 'refs/tags/native-v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create '${{ github.ref_name }}' dist/* --verify-tag --title 'Toolstock 2.1.0 — Windows без Docker' --notes-file docs/RELEASE-WINDOWS.md
    permissions:
      contents: write
