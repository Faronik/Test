name: Windows native server
on:
  push:
    branches: [main]
    tags: ['native-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/build/vcpkg-archives
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 69a1a33b4ba2b21e392c17e215ff637290778a97
          path: build/vcpkg
      - name: Prepare pinned vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          ./build/vcpkg/bootstrap-vcpkg.bat -disableMetrics
      - uses: actions/cache/restore@v4
        id: vcpkg-cache
        with:
          path: build/vcpkg-archives
          key: windows-static-${{ hashFiles('vcpkg.json') }}
          restore-keys: windows-static-
      - name: Build standalone C++ server and installer
        shell: pwsh
        run: |
          try { ./scripts/build-windows.ps1 -VcpkgRoot "$PWD/build/vcpkg" -Installer }
          catch {
            $message = ($_ | Out-String).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=Windows package build failed::$message"
            throw
          }
      - name: Exercise native server, service and installer
        shell: pwsh
        run: |
          try { ./tests/windows-native.ps1 }
          catch {
            $message = ($_ | Out-String).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=Windows integration check failed::$message"
            throw
          }
      - name: Record SHA256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { $_.Hash.ToLower() + '  ' + (Split-Path $_.Path -Leaf) } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Toolstock-Windows-x64
          path: dist/*
          if-no-files-found: error
      - name: Publish native release after successful checks
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/native-v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'version-string'
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME } else { 'native-v' + $version }
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'This version already has a release; this build remains available as a workflow artifact.'
          } else {
            $assets = (Get-ChildItem dist -File).FullName
            gh release create $tag @assets --target $env:GITHUB_SHA --title "Toolstock $version — Windows без Docker" --notes-file docs/RELEASE-WINDOWS.md
            if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
          }
      - uses: actions/cache/save@v4
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        with:
          path: build/vcpkg-archives
          key: windows-static-${{ hashFiles('vcpkg.json') }}
    permissions:
      contents: write
